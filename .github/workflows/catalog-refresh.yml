name: Refresh story catalog

on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: story-catalog-refresh
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run data:update
      - name: Commit changed snapshots
        shell: bash
        run: |
          if git diff --quiet -- public/data; then
            echo "Catalog snapshot is already current."
            exit 0
          fi
          git config user.name "teyvat-catalog-bot"
          git config user.email "actions@users.noreply.github.com"
          git add public/data
          git commit -m "data: refresh story catalog"
          git push
